<!DOCTYPE html><html lang=fr><head><meta charset=UTF-8 /><meta name=viewport content="width=device-width, initial-scale=1.0" /><title>Toy Story</title><link rel=stylesheet href=css/style.css /></head><body><div id=card-container><script type=text/javascript>fetch("datastory.json").then((response)=>response.json()).then((personnages)=>{const container=document.getElementById("card-container");container.innerHTML="";personnages.forEach((perso)=>{const card=`<div class="toy-card"><div class="toy-card__image"><img src="${perso.photo}"alt="${perso.nom}"/></div><div class="toy-card__name">${perso.nom}</div><div class="toy-card__description"><p>${perso.info}</p></div><div class="toy-card__unit-stats"><div class="one-third"><div class="stat">${perso.vie}</div><div class="stat-value">Vie</div></div><div class="one-third"><div class="stat">${perso.discretion}</div><div class="stat-value">Discrétion</div></div><div class="one-third"><div class="stat">${perso.action}</div><div class="stat-value">Action</div></div></div></div>`;container.innerHTML+=card;});});</script></div></div></body></html>
