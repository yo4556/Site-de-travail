<!DOCTYPE html><html lang="fr"><head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Exercice 3 : Calculer une aire</title></head><body> <h1>Exercice 3 : Calculer une aire avec le formulaire</h1> <form id="formulaire"> Longueur <input type="number" id="longueur" required> Largeur <input type="number" id="largeur" required> <button type="submit">Calculer</button> </form> <p id="resultat"></p> <script> function calculerUneAire(longueur, largeur) { return longueur * largeur; } document.getElementById("formulaire").addEventListener("submit", function(event) { event.preventDefault(); let longueur = parseFloat(document.getElementById("longueur").value); let largeur = parseFloat(document.getElementById("largeur").value); let resultat = calculerUneAire(longueur, largeur); document.getElementById("resultat").textContent = "L’aire de " + longueur + " m x " + largeur + " m = " + resultat + " m²"; }); </script></body></html>
